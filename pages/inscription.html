<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription | CampusConnect UMECI</title>

    <!-- Les chemins commencent par ../ car cette page est dans pages/ -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <link rel="stylesheet" href="../css/inscription.css">
</head>

<body>

    <header class="header">

        <a href="../index.html" class="logo">
            UMECI<span>SOCIAL</span>
        </a>

        <a href="../index.html" class="btn-inscription">
            Retour à l'accueil
        </a>

    </header>

    <main class="signup-container">

        <section class="signup-card">

            <h1>Créer un compte</h1>

            <p class="signup-description">
                Rejoins la communauté étudiante de l'UMECI.
            </p>

            <form id="signup-form">

                <div class="form-group">

                    <label for="nom">Nom</label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        placeholder="Ton nom de famille"
                        autocomplete="family-name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="prenom">Prénom(s)</label>

                    <input
                        type="text"
                        id="prenom"
                        name="prenom"
                        placeholder="Ton ou tes prénoms"
                        autocomplete="given-name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="matricule">Matricule étudiant UMECI</label>

                    <input
                        type="text"
                        id="matricule"
                        name="matricule"
                        placeholder="Ton matricule étudiant"
                        autocomplete="off"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">E-mail universitaire</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Ton adresse e-mail universitaire"
                        autocomplete="email"
                        required
                    >

                    <small>
                        Le domaine officiel devra être confirmé
                        avant de restreindre les inscriptions.
                    </small>

                </div>

                <div class="form-group">

                    <label for="motdepasse">Mot de passe</label>

                    <input
                        type="password"
                        id="motdepasse"
                        name="motdepasse"
                        placeholder="Au moins 8 caractères"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmation">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="confirmation"
                        name="confirmation"
                        placeholder="Répète ton mot de passe"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <div class="form-group checkbox-group">

                    <input
                        type="checkbox"
                        id="conditions"
                        name="conditions"
                        required
                    >

                    <label for="conditions">
                        J'accepte les conditions d'utilisation.
                    </label>

                </div>

                <button type="submit" class="btn-primary signup-button">
                    Créer mon compte
                </button>

                <p id="signup-message" aria-live="polite"></p>

            </form>

            <p class="login-link">
                Tu as déjà un compte ?
                <a href="connexion.html">Se connecter</a>
            </p>

            <p class="security-note">
                La vérification du matricule sera nécessaire
                avant l'approbation définitive du compte.
            </p>

        </section>

    </main>

    <script src="../js/inscription.js"></script>

</body>

</html>
